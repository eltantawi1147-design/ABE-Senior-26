.party-animation{
  position:relative;
  width:100%;
  height:220px;
  margin-top:40px;
  overflow:hidden;
}

.party{
  position:absolute;
  top:50%;
  font-size:90px;
  z-index:10;
}

/* الشمال */
.left-party{
  animation:leftParty 4s linear infinite;
}

/* اليمين */
.right-party{
  animation:rightParty 4s linear infinite;
}

@keyframes leftParty{

  /* البداية */
  0%{
    left:-160px;

    transform:
      translateY(-50%)
      rotate(0deg);
  }

  /* يوصلوا للنص */
  45%{
    left:calc(50% - 110px);

    transform:
      translateY(-50%)
      rotate(-12deg);
  }

  /* لفة سريعة */
  50%{
    left:calc(50% - 110px);

    transform:
      translateY(-50%)
      rotate(12deg);
  }

  /* يروح لليمين */
  100%{
    left:110%;

    transform:
      translateY(-50%)
      rotate(0deg);
  }
}

@keyframes rightParty{

  /* البداية */
  0%{
    right:-160px;

    transform:
      translateY(-50%)
      scaleX(-1)
      rotate(0deg);
  }

  /* يوصلوا للنص */
  45%{
    right:calc(50% - 110px);

    transform:
      translateY(-50%)
      scaleX(-1)
      rotate(-12deg);
  }

  /* لفة سريعة */
  50%{
    right:calc(50% - 110px);

    transform:
      translateY(-50%)
      scaleX(-1)
      rotate(12deg);
  }

  /* يروح للشمال */
  100%{
    right:110%;

    transform:
      translateY(-50%)
      scaleX(-1)
      rotate(0deg);
  }
}

function showView(viewName){
  Object.values(viewSections).forEach(section => {
    section.classList.remove("active");
  });

  if(viewSections[viewName]){
    viewSections[viewName].classList.add("active");
  }
}

document.querySelectorAll(".sidebar a").forEach(link => {
  link.addEventListener("click", (e) => {

    const view = link.getAttribute("data-view");
    showView(view);
    sidebar.classList.remove("active");
  });
});

    let activeTimers = [];

function clearTimers() {
  activeTimers.forEach(clearInterval);
  activeTimers = [];
}
function typeText(el, text, speed = 80) {

  let index = 0;
  let deleting = false;

  function loopTyping() {

    if (!deleting) {

      el.textContent = text.substring(0, index);
      index++;

      if (index > text.length) {
        deleting = true;

        setTimeout(loopTyping, 1200);
        return;
      }

    } else {

      el.textContent = text.substring(0, index);
      index--;

      if (index < 0) {
        deleting = false;
        index = 0;
      }

    }

    setTimeout(loopTyping, deleting ? 40 : speed);
  }

  loopTyping();
}

function swapImages(img1, img2, delay = 300) {

  let showingFirst = true;

  const timer = setInterval(() => {

    if (showingFirst) {

      img1.classList.remove("active");
      img2.classList.add("active");

    } else {

      img2.classList.remove("active");
      img1.classList.add("active");

    }

    showingFirst = !showingFirst;

  }, delay);

  activeTimers.push(timer);
}
function girlsCheck(student){
  return student.gender === "girl";
}
function renderResults(query) {

  clearTimers();

 const value = query.trim().toLowerCase();

  // 👇 مهم جداً: اخفاء كل الصفحات وقت البحث
  Object.values(viewSections).forEach(section => {
    section.classList.remove("active");
  });

  if (!value) {
    document.body.classList.remove("searching");
    resultsSection.classList.remove("active");
    resultsGrid.innerHTML = "";
    return;
  }

let matches = [];

if (value.includes("boy")) {
  matches = students.filter(s => s.gender === "boy");
} 
else if (value.includes("girl")) {
  matches = students.filter(s => s.gender === "girl");
} 
else {
  matches = students.filter(student =>
    student.name.toLowerCase().trim().includes(value)
  );
}

 document.body.classList.add("searching");
resultsSection.classList.add("active");

  resultsGrid.innerHTML = "";

  if (matches.length === 0) {
    document.body.classList.add("searching");

    resultsGrid.innerHTML = `
      <div style="
        text-align:center;
        width:100%;
        padding:40px;
        color:rgba(255,255,255,0.7);
        font-size:20px;
      ">
        No student found
      </div>
    `;

    return;
  }

  matches.forEach(student => {

    const card = document.createElement("div");

    card.className = "result-card";

    card.innerHTML = `

      <div class="result-info">

        <h2>${student.display}</h2>

        <p class="role-text"></p>

      </div>

      <div class="result-images">

        <div class="image-box">

          <img
            src="${student.image1}"
            class="student-image active"
            alt=""
          >

          <img
            src="${student.image2}"
            class="student-image"
            alt=""
          >

        </div>

      </div>

    `;

    resultsGrid.appendChild(card);

    const roleEl =
      card.querySelector(".role-text");

    const imgs = card.querySelectorAll(".student-image");
const img1 = imgs[0];
const img2 = imgs[1];
    typeText(roleEl, student.role);

    swapImages(img1, img2, 3000);

  });

}

      const searchQuery = urlParams.get("search");

      if (searchQuery) {
        searchInput.value = searchQuery;
        renderResults(searchQuery);
      }
    };

    searchInput.addEventListener("input", (e) => {
      renderResults(e.target.value);
